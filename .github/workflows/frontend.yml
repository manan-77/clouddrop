name: frontend

# Only when this side (or this workflow) changes: a backend-only change never runs the frontend
# job and the reverse. A contract change touches both sides, so both run.
on:
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [develop, main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
