name: backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clouddrop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clouddrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouddrop -d clouddrop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://clouddrop:ci-only-password@localhost:5432/clouddrop
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Create the test database
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U clouddrop -d clouddrop -c "CREATE DATABASE clouddrop_test"
          psql -h localhost -U clouddrop -d clouddrop_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
